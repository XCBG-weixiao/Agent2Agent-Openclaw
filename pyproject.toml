[project]
name = "edge-agent-collaboration"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "a2a-sdk[http-server]==1.3.0",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "mcp==2.3.0",
    "psutil>=6,<9",
    "uvicorn>=0.34,<1",
    "websockets>=15,<17",
]

[project.optional-dependencies]
agentscope = ["agentscope==2.0.11"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
